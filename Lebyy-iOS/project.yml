name: Lebyy
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Lebyy
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Lebyy uses photos for image-picker automation practice."
    INFOPLIST_KEY_NSCameraUsageDescription: "Lebyy uses camera for permission automation practice."
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lebyy uses location for permission automation practice."
targets:
  Lebyy:
    type: application
    platform: iOS
    sources:
      - path: Lebyy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.lebyy
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Lebyy/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.demo.lebyy
            CFBundleURLSchemes:
              - lebyy
schemes:
  Lebyy:
    build:
      targets:
        Lebyy: all
    run:
      config: Debug
    archive:
      config: Release
